name: Release

# A v* tag (only the maintainer can push one; see the "Protect release tags" ruleset) builds the DMG
# and drafts a GitHub release with it. Publishing the draft stays a manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write # to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the app's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^ *CFBundleShortVersionString: "([^"]+)"/\1/p' project.yml)
          [[ "v$version" == "$TAG" ]] || { echo "::error::Tag $TAG doesn't match the app's version $version in project.yml"; exit 1; }
      # Only what the app needs: mingw-w64 for the Steam web helper wrapper, XcodeGen for the project.
      - run: brew install mingw-w64 xcodegen
      # Also checks that the engine pack the app downloads is published.
      - run: scripts/make-dmg.sh
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          engine=$(sed -nE 's/.*version: "([^"]+)".*/\1/p' Packages/GameCore/Sources/GameCore/Engines/EnginePackPin.swift)
          cat >notes.md <<EOF
          Corkscrew $version for Apple Silicon Macs with macOS 26 or 27.

          ## Install

          1. Download **Corkscrew-$version.dmg** below, open it, and drag Corkscrew to Applications.
          2. Open Corkscrew. It isn't signed with an Apple Developer ID yet, so macOS blocks it the first time: click **Done**, then go to **System Settings → Privacy & Security**, click **Open Anyway** next to Corkscrew, and confirm. You only do this once.
          3. Click **Set Up Corkscrew**: it installs Rosetta if needed, downloads Wine with its graphics translators (engine $engine, about 300 MB, including D3DMetal from Apple's Game Porting Toolkit under Apple's non-commercial license), creates the "Games" bottle and installs Steam.
          4. Open Steam from the Library, sign in and install your games.

          The DMG's SHA-256 is in Corkscrew-$version.dmg.sha256. The engine's source code is published with [its release](https://github.com/$GITHUB_REPOSITORY/releases/tag/runtime-$engine).

          ## Changes

          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Corkscrew $version" \
            --notes-file notes.md --generate-notes "dist/Corkscrew-$version.dmg" "dist/Corkscrew-$version.dmg.sha256"
