name: Bug report
description: Something in Corkscrew doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If a specific game doesn't run, use the **Game report** form instead.
        For security problems, use private reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a bottle…
        2. Add…
        3. Press Play…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Corkscrew version
      description: The release version, or the commit if you built it yourself.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Release download (DMG)
        - Built from source
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: MacBook Pro 14", M4, 16 GB, macOS 26.1
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Graphics backend
      options:
        - Automatic
        - D3DMetal
        - DXMT
        - DXVK
        - WineD3D
        - Not related to graphics
  - type: checkboxes
    id: isolated
    attributes:
      label: Bottle
      options:
        - label: This happens in an isolated bottle
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From the game's Logs panel in the app, or `~/Library/Logs/Corkscrew`. Remove anything personal first.
      render: shell
